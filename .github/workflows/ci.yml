name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines.node 는 >=18. Windows + Node 24 는 과거 설치 크래시가 났던 조합이라
        # 반드시 포함한다 — 재귀 fs 회귀가 다시 나면 여기서 잡힌다.
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 의존성 제로 프로젝트 — install 단계 없음. 바로 스모크 테스트.
      - name: Run CLI smoke tests
        run: npm test

  # rules.json(C3)은 rules/**/*.md 의 표시에서 만든다. 표시만 고치고 다시 만들지 않으면
  # 여기서 막힌다. 출력은 OS와 무관하므로 ubuntu + node 22 한 번만 돈다.
  rules-index:
    name: rules-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: rules.json matches rule markers
        run: node scripts/build-rules-index.mjs && git diff --exit-code rules.json
